name: iOS GL4ES static library

on:
  workflow_dispatch:
  push:
    branches:
      - ios/feasibility-audit
      - ios/port-build-infra
    paths:
      - ".github/workflows/ios-gl4es-build.yml"
      - ".gitmodules"
      - "ios/**"
      - "source/src/**"
  pull_request:
    paths:
      - ".github/workflows/ios-gl4es-build.yml"
      - ".gitmodules"
      - "ios/**"
      - "source/src/platform.h"
      - "source/src/main.cpp"
      - "source/src/rendergl.cpp"

permissions:
  contents: read

jobs:
  build-gl4es:
    name: Build GL4ES for arm64 iOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out AssaultCube and GL4ES
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Apple build toolchain
        run: |
          xcodebuild -version
          cmake --version
          git submodule status

      - name: Check out pinned ios-cmake toolchain
        uses: actions/checkout@v4
        with:
          repository: leetal/ios-cmake
          ref: b36d5bce6f9a2d11d9f144bd5882ba31cfdca420
          path: ios-cmake

      - name: Configure GL4ES
        run: |
          cmake -S ios/third_party/gl4es -B build/gl4es -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DNOX11=ON \
            -DNOEGL=ON \
            -DSTATICLIB=ON \
            -DNO_LOADER=ON \
            -DNO_INIT_CONSTRUCTOR=ON \
            -DDEFAULT_ES=2

      - name: Build GL4ES
        run: cmake --build build/gl4es --config Release --target GL

      - name: Assemble static library and headers
        run: |
          test -f ios/third_party/gl4es/lib/libGL.a
          mkdir -p build/gl4es-package/include
          cp ios/third_party/gl4es/lib/libGL.a build/gl4es-package/
          cp -R ios/third_party/gl4es/include/GL build/gl4es-package/include/
          cp ios/third_party/gl4es/include/gl4esinit.h build/gl4es-package/include/
          cp ios/third_party/gl4es/include/gl4eshint.h build/gl4es-package/include/
          tar -czf gl4es-ios-arm64.tar.gz -C build/gl4es-package .

      - name: Upload GL4ES iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gl4es-ios-arm64
          path: gl4es-ios-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
