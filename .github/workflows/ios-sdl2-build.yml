name: iOS SDL2 static libraries

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-sdl2:
    name: Build SDL2 for arm64 iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out AssaultCube
        uses: actions/checkout@v4

      - name: Check out pinned SDL2 source
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: fe30456e94e89ef2cab50172121bffb7f7f50830
          path: SDL

      - name: Check out pinned ios-cmake toolchain
        uses: actions/checkout@v4
        with:
          repository: leetal/ios-cmake
          ref: b36d5bce6f9a2d11d9f144bd5882ba31cfdca420
          path: ios-cmake

      - name: Show Apple build toolchain
        run: |
          xcodebuild -version
          cmake --version
          git -C SDL rev-parse HEAD

      - name: Configure SDL2
        run: |
          cmake -S SDL -B build/sdl2 -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF

      - name: Build SDL2 static libraries
        run: |
          cmake --build build/sdl2 --config Release --target SDL2-static SDL2main
          find build/sdl2 -type f -name 'libSDL2*.a' -print

      - name: Assemble SDL2 iOS package
        run: |
          set -euo pipefail
          mkdir -p build/sdl2-package/lib build/sdl2-package/include
          find build/sdl2 -type f -name 'libSDL2*.a' -exec cp {} build/sdl2-package/lib/ \;
          test -f build/sdl2-package/lib/libSDL2.a
          cp -R SDL/include/. build/sdl2-package/include/
          if [ -d build/sdl2/include ]; then
            cp -R build/sdl2/include/. build/sdl2-package/include/
          fi
          if [ -d build/sdl2/include-config-release/SDL2 ]; then
            mkdir -p build/sdl2-package/include/SDL2
            cp -R build/sdl2/include-config-release/SDL2/. build/sdl2-package/include/SDL2/
          fi
          tar -czf SDL2-ios-arm64.tar.gz -C build/sdl2-package .

      - name: Upload SDL2 iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDL2-ios-arm64
          path: SDL2-ios-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
